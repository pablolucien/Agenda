AgendaDb.createCONTACTO=CREATE TABLE CONTACTO (\
	Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
	Deleted BOOLEAN NOT NULL DEFAULT FALSE,\
	Nombre VARCHAR(30),\
	Apellido VARCHAR(30),\
	Sexo VARCHAR(1) NOT NULL,\
	Pais VARCHAR(3) NOT NULL CONSTRAINT CONTACTO_PAIS_FK References PAIS(CODIGO),\
	VersionTelefono INTEGER NOT NULL DEFAULT 0,\
	VersionDireccion INTEGER NOT NULL DEFAULT 0,\
	VersionEmail INTEGER NOT NULL DEFAULT 0,\
	VersionGrupo INTEGER NOT NULL DEFAULT 0,\
	VersionImagen INTEGER NOT NULL DEFAULT 0,\
	VersionNotas INTEGER NOT NULL DEFAULT 0,\
	Dia INTEGER NOT NULL DEFAULT 0,\
	Mes INTEGER NOT NULL DEFAULT 0,\
	Ano INTEGER NOT NULL DEFAULT 0,\
	Marca VARCHAR(2),\
	FechaActualizacion TIMESTAMP,\
	FechaCreacion TIMESTAMP,\
	Listar BOOLEAN DEFAULT TRUE,\
    PRIMARY KEY (Clave, Version)\
)
#	VersionNombres INTEGER,\
#	VersionApellidos INTEGER,\
#ij> alter table root.contacto add VersionNombres INTEGER;
#ij> alter table root.contacto add VersionApellidos INTEGER;

AgendaDb.createINDEX_CONTACTO1=CREATE INDEX IDX_CONTACTO1 ON CONTACTO (NOMBRE, APELLIDO)
AgendaDb.createINDEX_CONTACTO2=CREATE INDEX IDX_CONTACTO2 ON CONTACTO (MARCA)
AgendaDb.createINDEX_CONTACTO3=CREATE INDEX IDX_CONTACTO3 ON CONTACTO (MES, DIA)
#AgendaDb.createINDEX_CONTACTO4=CREATE INDEX IDX_CONTACTO4 ON CONTACTO (FechaCreacion DESC)
#AgendaDb.createINDEX_CONTACTO5=CREATE INDEX IDX_CONTACTO5 ON CONTACTO (FechaActualizacion DESC)

AgendaDb.createGRUPO=CREATE TABLE GRUPO (\
	Clave INTEGER PRIMARY KEY,\
	NOMBRE VARCHAR(40) NOT NULL\
)

