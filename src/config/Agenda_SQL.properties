AgendaDb.createTELEFONO=CREATE TABLE TELEFONO(\
    Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
    Secuencia INTEGER NOT NULL,\
    countryPrefix VARCHAR(3) NOT NULL CONSTRAINT TELEFONO_Pais_FK REFERENCES PAIS,\
	Numero VARCHAR(15) NOT NULL,\
    Tipo INTEGER CONSTRAINT TELEFONO_TipoTelefono_FK REFERENCES TipoTelefono,\
    PRIMARY KEY (Clave, Version, Secuencia)\
)

AgendaDb.createDIRECCION=CREATE TABLE DIRECCION(\
    Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
    Secuencia INTEGER NOT NULL,\
	Direccion VARCHAR(100) NOT NULL,\
    PRIMARY KEY (Clave, Version, Secuencia)\
)

AgendaDb.createEMAIL=CREATE TABLE EMAIL(\
    Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
    Secuencia INTEGER NOT NULL,\
	Email VARCHAR(100) NOT NULL,\
    PRIMARY KEY (Clave, Version, Secuencia)\
)

AgendaDb.createIMAGEN=CREATE TABLE IMAGEN(\
    Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
	imagePath VARCHAR(260) NOT NULL,\
	thumbnail BLOB NOT NULL,\
    PRIMARY KEY (Clave, Version)\
)

AgendaDb.createNOTA=CREATE TABLE NOTA(\
    Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
    Secuencia INTEGER NOT NULL,\
	Nota VARCHAR(150) NOT NULL,\
    PRIMARY KEY (Clave, Version, Secuencia)\
)

