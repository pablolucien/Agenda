AgendaDb.createContactoGrupo=CREATE TABLE ContactoGrupo (\
	Clave INTEGER NOT NULL,\
	Version INTEGER NOT NULL,\
	Secuencia INTEGER NOT NULL,\
	ClaveGrupo INTEGER NOT NULL CONSTRAINT CONTACTOGRUPO_GRUPO_FK References GRUPO(Clave),\
	PRIMARY KEY (Clave, Version, Secuencia)\
)

